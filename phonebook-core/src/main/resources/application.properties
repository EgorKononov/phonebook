spring.application.name=phonebook
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

server.error.include-stacktrace=never

spring.datasource.url=${DB_HOST:localhost}/${DB_NAME:phonebook}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true